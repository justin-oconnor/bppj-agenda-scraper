name: Scrape BPPJ Agendas

on:
  schedule:
    - cron: '0 14 * * 1-5'
    - cron: '0 20 * * 1-5'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - run: python bppj-agenda-scraper.py
        env:
          WORK_EMAIL: ${{ secrets.WORK_EMAIL }}
          PERSONAL_EMAIL: ${{ secrets.PERSONAL_EMAIL }}
          PERSONAL_EMAIL_PASSWORD: ${{ secrets.PERSONAL_EMAIL_PASSWORD }}

      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_links.csv bppj-agendas.csv
          git commit -m "Update scraped data $(date)" || echo "No changes to commit"
          git push
